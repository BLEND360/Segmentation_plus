domain: financial_services
display_name: "Financial Services"

required_columns:
  - customer_id
  - age
  - annual_income

features:
  demographics:
    - age
    - gender
    - annual_income
    - education
    - marital_status
    - dependents
    - occupation
  financial:
    - account_balance
    - credit_score
    - monthly_spending
    - savings_rate
    - debt_to_income_ratio
    - investment_portfolio_value
  products:
    - has_credit_card
    - has_mortgage
    - has_personal_loan
    - has_investment_account
    - has_insurance
    - num_products
  behavioral:
    - digital_engagement_score
    - branch_visits_monthly
    - customer_tenure_years
    - transaction_frequency_monthly
    - avg_transaction_amount
  satisfaction:
    - nps_score
    - complaint_count_yearly
    - churn_risk_score

categorical_columns:
  - gender
  - education
  - marital_status
  - occupation

scaling_exclude:
  - customer_id
  - has_credit_card
  - has_mortgage
  - has_personal_loan
  - has_investment_account
  - has_insurance

feature_engineering:
  - name: wealth_tier
    formula: "annual_income * investment_portfolio_value"
    bins: [low, medium, high, ultra_high]
    description: "Combined wealth indicator from income and portfolio"

  - name: digital_vs_branch_ratio
    formula: "digital_engagement_score / (digital_engagement_score + branch_visits_monthly + 1)"
    description: "Channel preference ratio: higher = more digital"

  - name: product_depth
    formula: "has_credit_card + has_mortgage + has_personal_loan + has_investment_account + has_insurance"
    description: "Total number of product types held"

  - name: spending_to_income_ratio
    formula: "monthly_spending / (annual_income / 12 + 1)"
    description: "Monthly spending as fraction of monthly income"

  - name: risk_category
    formula: "credit_score * (1 - debt_to_income_ratio)"
    description: "Combined credit-risk indicator"

eda:
  domain_analyses:
    - income_distribution_by_segment
    - credit_score_vs_product_holdings
    - debt_to_income_analysis
    - high_value_customer_identification
    - product_cross_holding_matrix
    - digital_vs_branch_preference

persona_prompt_template: |
  You are a marketing strategist advising a financial services institution
  (bank, insurer, or wealth management firm) on their customer segments.

  Segment {segment_id} Profile:
  {segment_stats}

  Top SHAP Feature Drivers:
  {shap_drivers}

  Based on this data, generate a detailed customer persona including:
  1. Persona Name — a memorable, representative name
  2. One-Line Description — a concise tagline
  3. Demographics & Lifestyle — age range, income bracket, life stage
  4. Financial Goals — what they want to achieve
  5. Pain Points — frustrations, unmet needs
  6. Product Recommendations — cross-sell / upsell opportunities
  7. Preferred Communication Channels — email, app, branch, phone
  8. Marketing Strategy — tone, timing, offer types, campaign ideas

  Output as structured JSON with keys: name, tagline, demographics,
  goals, pain_points, product_recommendations, channels, strategy.

metadata:
  institution_types: [bank, insurer, wealth_manager, credit_union]
  typical_customer_count: "10K - 5M"
