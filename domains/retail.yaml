domain: retail
display_name: "Retail"

required_columns:
  - customer_id
  - total_spend

features:
  demographics:
    - age
    - gender
    - annual_income
    - location_tier
    - marital_status
  transactional:
    - total_spend
    - avg_order_value
    - purchase_frequency_monthly
    - days_since_last_purchase
    - total_orders
    - return_rate
  product:
    - has_loyalty_card
    - has_subscription
    - is_premium_tier
    - top_category
    - num_categories_purchased
  behavioral:
    - online_vs_instore_ratio
    - browse_to_buy_ratio
    - coupon_usage_rate
    - avg_session_duration_min
    - app_visits_monthly
  satisfaction:
    - csat_score
    - review_rating
    - support_tickets_yearly

categorical_columns:
  - gender
  - location_tier
  - marital_status
  - top_category

scaling_exclude:
  - customer_id
  - has_loyalty_card
  - has_subscription
  - is_premium_tier

feature_engineering:
  - name: rfm_recency
    formula: "1 / (days_since_last_purchase + 1)"
    description: "Inverse recency — higher = more recent purchase"

  - name: rfm_frequency
    formula: "purchase_frequency_monthly"
    description: "Direct frequency measure"

  - name: rfm_monetary
    formula: "avg_order_value * purchase_frequency_monthly"
    description: "Estimated monthly revenue from customer"

  - name: discount_sensitivity
    formula: "coupon_usage_rate * (1 - avg_order_value / (total_spend / (total_orders + 1) + 1))"
    description: "How responsive customer is to discounts"

  - name: cross_category_shopper
    formula: "num_categories_purchased >= 3"
    description: "Boolean: shops across 3+ categories"

eda:
  domain_analyses:
    - rfm_scoring_matrix
    - basket_composition_analysis
    - seasonal_purchase_patterns
    - channel_preference_mapping
    - category_affinity_heatmap
    - customer_lifetime_value_distribution

persona_prompt_template: |
  You are a retail marketing strategist advising a brand on their customer segments.

  Segment {segment_id} Profile:
  {segment_stats}

  Top SHAP Feature Drivers:
  {shap_drivers}

  Based on this data, generate a detailed customer persona including:
  1. Persona Name — a memorable, representative shopper name
  2. One-Line Description — a concise tagline
  3. Demographics & Lifestyle — age range, income, shopping style
  4. Shopping Habits — frequency, channels, categories, timing
  5. Brand Affinities — what they value in a brand
  6. Pain Points — frustrations, barriers to purchase
  7. Product Recommendations — categories, items, bundles
  8. Retention Strategy — loyalty, re-engagement, upsell ideas

  Output as structured JSON with keys: name, tagline, demographics,
  shopping_habits, brand_affinities, pain_points, product_recommendations, strategy.

metadata:
  business_types: [ecommerce, brick_and_mortar, d2c, marketplace]
